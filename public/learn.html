<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Materi · IELTS Coach</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<body>
<nav class="appnav" aria-label="Navigasi" data-page="learn"></nav>
<main class="wrap">

    </div>

  <section class="card" id="focus" aria-labelledby="focus-title">

  </section>

  <section aria-labelledby="reading-title">
    <div class="section-head"><h2 id="reading-title" class="eyebrow">Reading</h2></div>
    <div class="lesson-grid" id="reading-list"></div>
  </section>

  <section aria-labelledby="listening-title">
    <div class="section-head"><h2 id="listening-title" class="eyebrow">Listening</h2></div>
    <div class="lesson-grid" id="listening-list"></div>
