<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<script>try{if(localStorage.getItem("ielts-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<title>Pilih peranmu · IELTS Coach</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="IELTS Coach">
<link rel="stylesheet" href="/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
</head>
<body>
<main class="picker">
  <header class="picker-top">
    <span class="brand"><span class="brand-mark" id="picker-mark"></span><span>IELTS Coach</span></span>
    <span id="picker-theme"></span>
  </header>
  <div class="picker-head">
    <p class="eyebrow" id="greeting">Semangat!</p>
    <h1>Pilih peranmu</h1>
  </div>
  <section class="bento picker-bento" aria-label="Profil">
    <article class="tile lime hero-tile">
      <div class="hero-count" id="hero-count"></div>
      <figure class="hero-quote">
        <figcaption class="tile-label">Penyemangat hari ini</figcaption>
        <blockquote><p id="motivation"></p></blockquote>
      </figure>
    </article>
    <div class="who-grid" id="who"></div>
  </section>
  <p class="hint picker-foot">Tes, latihan, jurnal, kartu, dan tulisan masing-masing tersimpan terpisah. Simpan link pribadimu sebagai bookmark untuk langsung masuk; nama, peran, modul, dan target bisa diubah di Pengaturan.</p>
</main>
<script type="module" src="/profiles.js"></script>
</body>
</html>
