<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Masuk · IELTS Coach</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="IELTS Coach">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login">
  <form class="bento login-box" id="login">
    <div class="tile lime login-hero">
      <span class="brand-mark big" id="login-mark"></span>
      <h1>IELTS Coach</h1>
      <p>Ruang belajar pribadi. Masukkan password untuk lanjut.</p>
    </div>
    <div class="login-body">
      <label class="fl">Password
        <input class="tf" type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="msg" id="login-msg" role="alert" hidden></p>
      <button class="btn primary" type="submit">Masuk</button>
    </div>
  </form>
</main>
<script type="module" src="/masuk.js"></script>
</body>
</html>
